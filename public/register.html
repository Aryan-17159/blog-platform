<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account — Marginalia</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/index.html" class="brand">margin<em>alia</em></a>
    <div class="nav-links" id="nav-links"></div>
  </div>
</nav>

<main class="form-page">
  <div class="form-card">
    <h1 class="form-title">Start writing</h1>
    <p class="form-sub">Create an account to publish posts and join the conversation in the margins.</p>

    <div id="form-banner" class="banner" style="display:none;"></div>

    <form id="register-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required minlength="3" maxlength="24" autocomplete="username" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-accent" style="width:100%; justify-content:center;">Create account</button>
    </form>

    <p class="form-footer">Already have an account? <a href="/login.html">Sign in</a></p>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
